# CI (cicd-pipeline.md "CI İş Akışı"): bütün denetimler engelleyicidir; biri başarısızsa parça
# main'e eklenmez. Otomatik yeniden deneme yoktur; sınırlar gevşetilmez (team.md Testing Posture).
name: ci

on:
  push:
    branches: [main, 'bolt/**']
    # Her gönderimde çalışır: birleştirme kapısı (merge-bolt.sh) dalın baş commit'i için
    # başarılı bir çalıştırma arar; baş commit yalnızca belge içerse de (inceleme bulgusu R-01).
  workflow_dispatch:
  # release.yml bu iş akışını etiketli commit'te yeniden kullanır (inceleme bulgusu R-04).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/bolt/') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Biçim
        run: npm run format:check
      - name: Denetim (IP okuma, HTML ekleme ve gömülü metin yasakları dahil)
        run: npm run lint
      - name: Tür denetimi
        run: npm run typecheck
      - name: Depo biçimi yalnızca ekleme (NFR5.10)
        run: npm run check:migrations

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Testler + kapsam (%80 / %90) + bot oyunculu uçtan uca test
        run: npm run verify
      - name: Raporlar
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}
          path: |
            reports/
            coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Web derlemesi
        run: npm run build:web
      - name: Paket boyutu ≤ 150 KB ve satır içi stil yok
        run: npm run check:bundle
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Erişilebilirlik taraması (320 px, iki tema)
        run: npm run test:a11y
      - name: Erişilebilirlik raporu
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: reports/a11y-report.json
          retention-days: 7
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Bağımlılık güvenliği (yüksek/kritik bulgu engeller)
        run: npm audit --audit-level=high
      - name: Paket imzaları
        run: npm audit signatures
      - name: Sır taraması
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
